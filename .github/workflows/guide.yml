name: Guide

# The help page, the very one the application serves at /help/index.html, published with
# GitHub Pages: https://videoframeexpedition.github.io/video-frame-expedition-resolve/

on:
  push:
    branches: [main]
    paths:
      - "frontend/public/help/**"
      - ".github/workflows/guide.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the guide
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/public/help

      - id: deployment
        uses: actions/deploy-pages@v5
