name: Bug report · Signaler un bug
description: Something does not work as described in the README. · Quelque chose ne marche pas comme le décrit le README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: remove any personal information (names, paths containing your user name) before sending. A security flaw is reported privately, from the "Security" tab.

        Les issues sont publiques : retirez toute information personnelle (noms, chemins contenant votre nom d'utilisateur) avant d'envoyer. Une faille de sécurité se signale en privé, depuis l'onglet « Security ».
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? · Que s'est-il passé ?
      description: What you were doing, what you expected, what you got. · Ce que vous faisiez, ce que vous attendiez, ce que vous avez obtenu.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and its version · Système et sa version
      description: "Windows: Settings > System > About. macOS: Apple menu > About This Mac. · Windows : Paramètres > Système > Informations système. macOS : menu Pomme > À propos de ce Mac."
      placeholder: Windows 11 24H2 · macOS 15.6
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Graphics card, or Mac · Carte graphique, ou Mac
      description: "A PC: the card's name and its video memory. A Mac: its chip and its memory. · Un PC : le nom de la carte et sa mémoire vidéo. Un Mac : sa puce et sa mémoire."
      placeholder: NVIDIA GeForce RTX 4070, 12 GB · Apple M3 Pro, 36 GB
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model server and model loaded · Serveur de modèles et modèle chargé
      placeholder: LM Studio, qwen/qwen3-vl-8b
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message · Message d'erreur
      description: The message shown, if any. The output of `vfe doctor` helps too. · Le message affiché, s'il y en a un. La sortie de `vfe doctor` aide aussi.
      render: text
