[project]
name = "vfe-vision"
version = "1.3.0"
description = "Video Frame Expedition for DaVinci Resolve — local-first video analysis with a local vision model (LM Studio), web UI and MCP server."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Video Frame Expedition" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
dependencies = [
    "alembic>=1.20.0",
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "filelock>=4.0.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.2,<3",
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "platformdirs>=4.11.15",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.1",
    "sse-starlette>=3.4.11",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "timezonefinder>=9.0.0",
    # timezonefinder's h3: 4.5.0 is too recent for Smart App Control, which refuses its compiled
    # modules (no reputation yet); 4.4.2 loads.
    "h3>=4,<4.5",
    "tokenizers>=0.23.2",  # EmbeddingGemma's tokenizer (already a faster-whisper dependency)
    "typer>=0.27.2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
    "xxhash>=4.0.1",
]

[project.scripts]
vfe = "vfe_vision.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vfe_vision"]

[tool.hatch.build]
# The production frontend build is not versioned but must ship inside the wheel.
artifacts = ["src/vfe_vision/web/dist/**"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/vfe_vision/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE",
    "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "TRY",
    "FLY", "PERF", "RUF", "S", "ASYNC", "BLE", "FBT", "LOG", "G",
]
ignore = [
    "PLR0913",  # many-arguments: pipeline stages legitimately take several collaborators
    "TRY003",   # long exception messages are fine and helpful
    "PLR2004",  # magic values: thresholds are documented constants at use site
    "FBT001", "FBT002",  # boolean flags in Typer/FastAPI signatures
    "S603",     # subprocess without shell: we always pass argument lists
    "ISC001",   # conflicts with the formatter
    "RUF001", "RUF002", "RUF003",  # French typography (×, ’, « ») is intentional
    "PLC0415",  # lazy imports are deliberate (Windows-only ctypes, heavy ML libraries)
    "PTH100",   # os.path.abspath: normalise without resolving symlinks, unlike Path.resolve
    "ARG002",   # overridden methods do not always use every argument of the base signature
    # Platform branches keep their else after a return: mypy then reads each system's branch
    # with that system's library and sees no dead code (macOS, Linux and Windows alike).
    "RET505", "RET506",
]
# Note: the TC (type-checking imports) rules are not enabled: Pydantic and SQLAlchemy evaluate
# annotations at runtime, so moving imports under TYPE_CHECKING would break the models.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG", "FBT", "S311", "PLC0415", "S108", "S603", "S607", "ASYNC240", "DTZ001", "E501"]
"src/vfe_vision/cli.py" = ["PLC0415"]
"src/vfe_vision/api/routers/**" = ["PLR0917", "PLR0913", "B008"]  # FastAPI endpoint signatures
"src/vfe_vision/db/migrations/**" = ["S101", "ARG001", "PLC0415", "E501", "INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "xxhash.*", "onnxruntime.*", "faster_whisper.*", "astral.*",
          "timezonefinder.*", "reverse_geocode.*", "pynvml.*", "imagehash.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The fixed DaVinci Resolve script and the timeline reader, builder and editor children: plain
# Python around Resolve's dynamic scripting API.
module = [
    "vfe_vision.adapters.resolve.apply_payload_v1",
    "vfe_vision.adapters.resolve.timeline_builder",
    "vfe_vision.adapters.resolve.timeline_editor",
    "vfe_vision.adapters.resolve.timeline_reader",
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not lmstudio and not models and not gpu and not network",
]
markers = [
    "lmstudio: needs a running LM Studio server with a vision model loaded",
    "models: needs downloaded ONNX / Whisper models",
    "gpu: needs a CUDA GPU with free VRAM",
    "network: needs internet access (Open-Meteo, Nominatim)",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::DeprecationWarning:vfe_vision.*"]
timeout = 120

[tool.coverage.run]
source = ["vfe_vision"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "vfe_vision"

[[tool.importlinter.contracts]]
name = "Domain is pure (no I/O layers)"
type = "forbidden"
source_modules = ["vfe_vision.domain"]
forbidden_modules = [
    "vfe_vision.adapters", "vfe_vision.db", "vfe_vision.api", "vfe_vision.mcp",
    "vfe_vision.services", "vfe_vision.jobs", "vfe_vision.pipeline", "vfe_vision.storage",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "vfe_vision.cli",
    "vfe_vision.api",  # the HTTP app hosts the MCP transport (never the other way round)
    "vfe_vision.mcp",
    "vfe_vision.services",
    "vfe_vision.jobs",
    "vfe_vision.pipeline",
    "vfe_vision.adapters : vfe_vision.db : vfe_vision.storage",
    "vfe_vision.ports",
    "vfe_vision.domain",
    "vfe_vision.core",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
